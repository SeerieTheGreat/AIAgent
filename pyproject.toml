[project]
name = "shouhu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "web3>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
shouhu-chat = "shouhu.cli:main"
shouhu-owner = "shouhu.owner:main"
shouhu-deploy = "shouhu.deploy:main"
shouhu-demo = "shouhu.demo:main"
shouhu-redteam = "shouhu.redteam:main"
shouhu-evidence = "shouhu.evidence:main"
shouhu-try = "shouhu.trycontract:main"
shouhu-verify = "shouhu.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shouhu"]
